<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N8N Workflow Converter</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <svg class="header-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.7 19L13.6 9.9C14.5 7.6 14 4.9 12.1 3C10.1 1 7.1 0.6 4.7 1.7L9 6L6 9L1.6 4.7C0.4 7.1 0.9 10.1 2.9 12.1C4.8 14 7.5 14.5 9.8 13.6L18.9 22.7C19.3 23.1 19.9 23.1 20.3 22.7L22.6 20.4C23.1 20 23.1 19.3 22.7 19Z" fill="currentColor"/>
                </svg>
                <div class="header-text">
                    <h1>N8N Workflow Converter</h1>
                    <p class="subtitle">ترجمه، RTL و بومی‌سازی گردش‌کارها با هوش مصنوعی</p>
                </div>
            </div>
        </header>

        <nav class="stepper" role="navigation" aria-label="Workflow conversion steps">
            <button class="stepper-segment active" data-step="translate" aria-label="ترجمه محتوا" aria-current="step">
                <span class="stepper-label">ترجمه محتوا</span>
            </button>
            <button class="stepper-segment" data-step="rtl" aria-label="تبدیل RTL">
                <span class="stepper-label">تبدیل RTL</span>
            </button>
            <button class="stepper-segment" data-step="nodes" aria-label="ترجمه نام نودها">
                <span class="stepper-label">ترجمه نام نودها</span>
            </button>
            <button class="stepper-segment" data-step="complete" aria-label="تکمیل نهایی">
                <span class="stepper-label">تکمیل نهایی</span>
            </button>
        </nav>

        <!-- Translation Step -->
        <div id="translate-step" class="step-content active">
            <div class="section">
                <h2>ترجمه محتوا</h2>
                <p class="section-description">ترجمه متن‌های داخل Workflow</p>
                
                <div class="form-group">
                    <label for="trans-api-key">AvalAI API Key</label>
                    <input type="password" id="trans-api-key" placeholder="Enter your API key" aria-required="true">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="trans-language">زبان مقصد</label>
                        <select id="trans-language" aria-required="true">
                            <option value="فارسی">فارسی</option>
                            <option value="English">English</option>
                            <option value="العربية">العربية</option>
                            <option value="Español">Español</option>
                            <option value="Français">Français</option>
                            <option value="Deutsch">Deutsch</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="trans-model">مدل هوش مصنوعی</label>
                        <select id="trans-model" aria-required="true"></select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="trans-workflow">Workflow JSON</label>
                    <textarea id="trans-workflow" rows="15" placeholder="Paste your N8N workflow JSON here..." aria-required="true"></textarea>
                </div>
                
                <div class="button-group">
                    <button class="btn btn-secondary" onclick="analyzeWorkflow('trans')" type="button">Analyze</button>
                    <button class="btn btn-primary" onclick="translateWorkflow()" type="button">Translate</button>
                </div>
                
                <div id="trans-result" class="result-area" role="region" aria-live="polite"></div>
            </div>
        </div>

        <!-- RTL Conversion Step -->
        <div id="rtl-step" class="step-content">
            <div class="section">
                <h2>تبدیل RTL</h2>
                <p class="section-description">تبدیل چیدمان Workflow به RTL</p>
                
                <div class="form-group">
                    <label for="rtl-workflow">LTR Workflow JSON</label>
                    <textarea id="rtl-workflow" rows="15" placeholder="Paste your LTR workflow JSON here..." aria-required="true"></textarea>
                </div>
                
                <div class="form-group">
                    <label for="rtl-canvas-width">عرض Canvas (0 = خودکار)</label>
                    <input type="number" id="rtl-canvas-width" value="0" min="0" step="50">
                </div>
                
                <button class="btn btn-primary" onclick="convertRTL()" type="button">Convert to RTL</button>
                
                <div id="rtl-result" class="result-area" role="region" aria-live="polite"></div>
            </div>
        </div>

        <!-- Node Names Step -->
        <div id="nodes-step" class="step-content">
            <div class="section">
                <h2>ترجمه نام نودها</h2>
                <p class="section-description">ترجمه و بومی‌سازی نام نودها</p>
                
                <div class="form-group">
                    <label for="nodes-api-key">AvalAI API Key</label>
                    <input type="password" id="nodes-api-key" placeholder="Enter your API key" aria-required="true">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="nodes-language">زبان مقصد</label>
                        <select id="nodes-language" aria-required="true">
                            <option value="فارسی">فارسی</option>
                            <option value="English">English</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="nodes-model">مدل هوش مصنوعی</label>
                        <select id="nodes-model" aria-required="true"></select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="nodes-workflow">Workflow JSON</label>
                    <textarea id="nodes-workflow" rows="15" placeholder="Paste your N8N workflow JSON here..." aria-required="true"></textarea>
                </div>
                
                <div class="button-group">
                    <button class="btn btn-secondary" onclick="analyzeNodeNames()" type="button">Analyze</button>
                    <button class="btn btn-primary" onclick="translateNodeNames()" type="button">Translate Names</button>
                </div>
                
                <div id="nodes-result" class="result-area" role="region" aria-live="polite"></div>
            </div>
        </div>

        <!-- Complete Localization Step -->
        <div id="complete-step" class="step-content">
            <div class="section">
                <h2>تکمیل نهایی</h2>
                <p class="section-description">اجرای همه مراحل به‌صورت یکجا</p>
                
                <div class="form-group">
                    <label for="complete-api-key">AvalAI API Key</label>
                    <input type="password" id="complete-api-key" placeholder="Enter your API key" aria-required="true">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="complete-language">زبان مقصد</label>
                        <select id="complete-language" aria-required="true">
                            <option value="فارسی">فارسی</option>
                            <option value="English">English</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="complete-model">مدل هوش مصنوعی</label>
                        <select id="complete-model" aria-required="true"></select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="complete-workflow">Workflow JSON</label>
                    <textarea id="complete-workflow" rows="15" placeholder="Paste your N8N workflow JSON here..." aria-required="true"></textarea>
                </div>
                
                <div class="form-group">
                    <label>گزینه‌های پردازش</label>
                    <div class="checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="complete-translate-notes" checked>
                            <span>ترجمه Sticky Notes</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="complete-translate-nodes" checked>
                            <span>ترجمه نام نودها</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="complete-convert-rtl" checked>
                            <span>تبدیل به RTL Layout</span>
                        </label>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="complete-canvas-width">عرض Canvas (0 = خودکار)</label>
                    <input type="number" id="complete-canvas-width" value="0" min="0" step="50">
                </div>
                
                <button class="btn btn-primary" onclick="completeLocalization()" type="button">Complete Localization</button>
                
                <div id="complete-result" class="result-area" role="region" aria-live="polite"></div>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
